base-url: http://taiyiflow-platform:8080
auth:
  type: API_KEY
  token-secret: TAIYIFLOW_API_KEY
identity:
  worker-id: backend-worker-1
  display-name: Backend Digital Worker
  role: COLLABORATION_WORKER
  # Declare only abilities implemented by the configured task handler or extensions.
  abilities: []
workspace: /var/lib/taiyiflow/worker
state-dir: /var/lib/taiyiflow/runtime-state
outbox:
  max-entries: 1000
  max-entry-bytes: 1048576
  max-total-bytes: 16777216
  max-retries: 32
recovery-policy: AUTO
permission-policy: CONFIRM
approval:
  channel: PLATFORM
execution:
  concurrency: 3
  connect-timeout: PT15S
  drain-timeout: PT30S
  request-timeout: PT30S
tools:
  builtin-tools: false
  allowed-shell-commands: []
  media: false
  skills:
    enabled: false
    platform-enabled: false
    # workspace-dir defaults to <workspace>/.snz1dp/skills.
    # user-dir: /var/lib/taiyiflow/user-skills
    # compat-dir: /var/lib/taiyiflow/compat-skills
    default-names: []
    bundled-resources: []
    tolerate-platform-failure: true
    sync-mode: DISABLED
  browser:
    mode: DISABLED
    # HEADLESS and REMOTE_CDP are mutually exclusive alternatives.
    # mode: HEADLESS
    # executable-path: /opt/pw-browsers/chromium-1148/chrome-linux/chrome
    launch-arguments: []
    action-timeout: PT15S
    max-pages-per-session: 10
    max-read-text-characters: 30000
    max-console-messages: 200
    max-screenshot-bytes: 1048576
    execute-js-enabled: false
    allowed-hosts: []
    allowed-cidrs: []
    # mode: REMOTE_CDP
    # remote-endpoint-secret: TAIYIFLOW_CDP_ENDPOINT
    # remote-authorization-secret: TAIYIFLOW_CDP_AUTHORIZATION
extensions:
  identity-validator: your.platform.PlatformWorkerIdentityValidator
  # task-handler: your.platform.BusinessTaskHandler
  # approval-handler: your.platform.PlatformApprovalHandler
  # approval-audit: your.platform.PlatformApprovalAudit
  # hooks: [your.platform.MetricsWorkerHook]

# Persistent-token authentication uses an encrypted store outside workspace:
# auth:
#   type: PERSISTENT_TOKEN
#   token-secret: TAIYIFLOW_PERSISTENT_TOKEN
#   device-id: backend-device-1
#   credential-file: /var/lib/taiyiflow-credentials/credentials.json
#   key-file: /var/lib/taiyiflow-credentials/encryption.key

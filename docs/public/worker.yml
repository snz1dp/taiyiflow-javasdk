base-url: http://taiyiflow-platform:8080
auth:
  type: API_KEY
  token-secret: TAIYIFLOW_API_KEY
identity:
  worker-id: backend-worker-1
  display-name: Backend Digital Worker
  role: COLLABORATION_WORKER
  # Declare only abilities implemented by the configured task handler or extensions.
  abilities: []
workspace: /var/lib/taiyiflow/worker
state-dir: /var/lib/taiyiflow/runtime-state
outbox:
  max-entries: 1000
  max-entry-bytes: 1048576
  max-total-bytes: 16777216
  max-retries: 32
recovery-policy: AUTO
permission-policy: CONFIRM
# Fine-grained permission settings; configuration-only (skill content/model arguments cannot alter them).
permission:
  # Rules match by tool-name and/or shell command prefix; priority deny > ask > allow.
  # Unknown actions fall back to ask; entries without selectors are dropped.
  rules: []
  #   - action: deny
  #     command-prefix: rm
  #   - action: ask
  #     tool-name: schedule_delete
  write-confirmation: confirm   # confirm | direct (file_edit / write_file)
  # Per-category policy overrides: shell | file | browser | skill | schedule.
  categories: {}
  #   shell: auto
  #   file: readonly
approval:
  channel: PLATFORM
execution:
  concurrency: 3
  connect-timeout: PT15S
  drain-timeout: PT30S
  request-timeout: PT30S
  stream-idle-timeout: PT1200S   # 0 disables idle checks
  # tool-execution-timeout: PT40M  # optional; raised to max registered tool time + 60s (floor 31min)
  # max-session-concurrency: 3  # optional; default follows server /config client_max_session_concurrency (0 blocks new chats)
# First-frame request defaults; explicit per-request values always win.
request:
  input-type: chat
  output-type: chat
  # client-type: device  # first-frame client_type; the backend merges built-in skills by this value
  # model: qwen-max
  # reasoning: true
  # internet-search: true
  # knowledge-scopes: []   # knowledge base scope ids (list)
  # knowledge-docs: []     # knowledge document ids (list)
  auto-loop-enabled: false
  # auto-loop-max-rounds: 6
  image-generation: AUTO  # AUTO | "ON" | "OFF" (quote ON/OFF: YAML 1.1 treats them as booleans)
  # group-id: <session-group-uuid>
  relation-sessions: []
  # agent-app-id: <app-id>
  # agent-app-owner-id: <owner-uuid>
  # client-context-dir: <context-label>
  # long-term-memory-enabled: true
  # cross-session-memory-enabled: false
  # Opt-in client_instructions supply from explicit directories only (no home scan).
  instruction-directories: []
tools:
  builtin-tools: false
  allowed-shell-commands: []
  # shell:
  #   command-timeout: PT30S  # built-in shell command timeout (plugin default 30s)
  # subtask:
  #   timeout: PT1H           # per-subtask completion timeout
  #   max-parallelism: 4      # local ceiling; server max_parallelism_subtask only tightens it (0 disables run_subtask)
  #   max-tasks: 16           # local batch ceiling
  media: false
  skills:
    enabled: false
    platform-enabled: false
    # workspace-dir defaults to <workspace>/.snz1dp/skills.
    # user-dir: /var/lib/taiyiflow/user-skills
    # compat-dir: /var/lib/taiyiflow/compat-skills
    default-names: []
    bundled-resources: []
    tolerate-platform-failure: true
    sync-mode: DISABLED
  browser:
    mode: DISABLED
    # Browser tool approval mode, independent of the global policy:
    # ask | follow_a_plan | skip_all_permission_checks (unknown values fall back to ask)
    permission-mode: ask
    # HEADLESS and REMOTE_CDP are mutually exclusive alternatives.
    # mode: HEADLESS
    # executable-path: /opt/pw-browsers/chromium-1148/chrome-linux/chrome
    launch-arguments: []
    action-timeout: PT15S
    max-pages-per-session: 10
    max-read-text-characters: 30000
    max-console-messages: 200
    max-screenshot-bytes: 1048576
    execute-js-enabled: false
    allowed-hosts: []
    allowed-cidrs: []
    # mode: REMOTE_CDP
    # remote-endpoint-secret: TAIYIFLOW_CDP_ENDPOINT
    # remote-authorization-secret: TAIYIFLOW_CDP_AUTHORIZATION
extensions:
  identity-validator: your.platform.PlatformWorkerIdentityValidator
  # task-handler: your.platform.BusinessTaskHandler
  # approval-handler: your.platform.PlatformApprovalHandler
  # approval-audit: your.platform.PlatformApprovalAudit
  # hooks: [your.platform.MetricsWorkerHook]

# Persistent-token authentication uses an encrypted store outside workspace:
# auth:
#   type: PERSISTENT_TOKEN
#   token-secret: TAIYIFLOW_PERSISTENT_TOKEN
#   device-id: backend-device-1
#   credential-file: /var/lib/taiyiflow-credentials/credentials.json
#   key-file: /var/lib/taiyiflow-credentials/encryption.key
